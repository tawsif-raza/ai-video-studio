<title id="t">ai-video-studio · production path</title><desc id="d">An idea becomes a production package through LLM planning agents, a human supplies media, the producer builds a deterministic edit plan, FFmpeg renders it, ffprobe verifies the output, and the publishing engine uploads it.</desc>
